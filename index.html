<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Oculistico Rapisarda</title>

<style>
/* RESET */
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
html{scroll-behavior:smooth}

body{line-height:1.5}

.container{width:90%;max-width:1200px;margin:auto}

/* NAVBAR */
.navbar{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1000}
.navbar .container{display:flex;justify-content:space-between;align-items:center;padding:15px 0}
.logo{font-weight:bold}

.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{text-decoration:none;color:#333}

.menu-toggle{display:none;font-size:26px;background:none;border:none}

/* HERO */
.hero{padding:80px 0;text-align:center;background:#f5f7fa}
.btn{padding:12px 18px;background:#0077cc;color:#fff;border:none;border-radius:5px;cursor:pointer}

/* GRID */
.servizi-grid,.interventi-grid,.prestazioni-grid,.contatti-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
}

.servizio-card,.intervento-card,.prestazione-item{
 padding:20px;border:1px solid #ddd;border-radius:10px;text-align:center
}

/* CHI SIAMO */
.chi-siamo-content{display:flex;gap:30px;margin-top:20px}

/* CONTATTI */
.contatti-grid{margin-top:20px}

/* MAPPA */
.mappa-container iframe{width:100%;height:300px;border:0}

/* MOBILE */
@media(max-width:768px){

.menu-toggle{display:block}

.nav-links{
 display:none;
 flex-direction:column;
 position:absolute;
 top:60px;
 left:0;
 width:100%;
 background:#fff;
 padding:20px;
}

.nav-links.active{display:flex}

.chi-siamo-content{flex-direction:column}

.btn{width:100%}
}
</style>
</head>

<body>

<nav class="navbar">
<div class="container">
<div class="logo">Studio Oculistico Rapisarda</div>
<button class="menu-toggle">☰</button>
<ul class="nav-links">
<li><a href="#home">Home</a></li>
<li><a href="#servizi">Servizi</a></li>
<li><a href="#contatti">Contatti</a></li>
</ul>
</div>
</nav>

<section class="hero" id="home">
<div class="container">
<h1>Studio Oculistico Rapisarda</h1>
<p>La tua visione è la nostra priorità</p>
<button class="btn" onclick="document.getElementById('contatti').scrollIntoView()">Prenota Visita</button>
</div>
</section>

<section id="servizi" class="container">
<h2>Servizi</h2>
<div class="servizi-grid">
<div class="servizio-card">👁️ Visita Completa</div>
<div class="servizio-card">👓 Occhiali</div>
<div class="servizio-card">🔬 Diagnostica</div>
</div>
</section>

<section id="contatti" class="container">
<h2>Contatti</h2>
<div class="contatti-grid">
<div>📍 Via Milano 3, Catania</div>
<div>📞 <a href="tel:+39095431500">Chiama</a></div>
</div>

<div class="mappa-container">
<iframe src="https://www.google.com/maps?q=Via%20Milano%203%20Catania&output=embed"></iframe>
</div>
</section>

<script>
document.querySelector('.menu-toggle').addEventListener('click',()=>{
document.querySelector('.nav-links').classList.toggle('active')
})
</script>

</body>
</html>
